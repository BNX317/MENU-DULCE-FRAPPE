<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Menú | Dulce Frappe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f8eee3;
            font-family: Arial, Helvetica, sans-serif;
            color: #3d2118;
        }

        header {
            text-align: center;
            padding: 25px 15px 20px;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        header p {
            color: #087f8c;
            font-size: 15px;
        }

        .botones {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 15px 20px;
            position: sticky;
            top: 0;
            z-index: 10;
            background: #f8eee3;
        }

        .botones button {
            border: none;
            background: #087f8c;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .botones button:active {
            transform: scale(0.96);
        }

        .menu {
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 0 10px 30px;
        }

        .menu img {
            width: 100%;
            height: auto;
            display: block;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,.15);
        }

        footer {
            text-align: center;
            padding: 10px 15px 30px;
            color: #777;
            font-size: 13px;
        }

        html {
            scroll-behavior: smooth;
        }
    </style>
</head>

<body>

<header>
    <h1>🩵 Dulce Frappe 🩵</h1>
    <p>Hecho con amor • Pineda</p>
</header>

<div class="botones">
    <button onclick="irA('frappes')">🥤 Frappés</button>
    <button onclick="irA('comida')">🍔 Comida</button>
</div>

<main class="menu">

    <img
        id="frappes"
        src="MENU2.jpeg"
        alt="Menú de Frappés Dulce Frappe"
    >

    <img
        id="comida"
        src="MENU.jpeg"
        alt="Menú de comida Dulce Frappe"
    >

</main>

<footer>
    Dulce Frappe • Gracias por elegirnos 🩵
</footer>

<script>
    function irA(id) {
        document.getElementById(id).scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
</script>

</body>
</html>
